name: Animation correctness

on: [push, pull_request]

jobs:
  animation-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - run: python -m pip install uv
      - run: uv sync --project animations --locked
      - run: uv run --project animations --locked --with pytest python -m pytest -q animations/tests
        env:
          PYTHONPATH: animations
      - run: git diff --check
      - run: uv run --project animations --locked python -m unittest discover -s animations/visual_checks -p 'test_*.py'
        env:
          PYTHONPATH: animations
